# Opens the PR that prepares the next rc, GA or patch on release/<major.minor>:
# moves RELEASE, writes the CHANGELOG section and, for a patch, moves the whole
# workspace version. Merging that PR is the release. Run it from a
# workflow_dispatch workflow with the release branch selected as the ref.
#
# A GA also opens (or updates) a release-date/<major.minor> PR to main that
# dates main's `## <major.minor>.0 …` changelog heading with the date the GA
# gives the release branch, so both read `## <major.minor>.0 (date)`.
#
# token opens the PR. A PR opened with GITHUB_TOKEN runs no CI, and an
# organisation may not let GITHUB_TOKEN open PRs at all, so pass a GitHub App
# token with contents and pull-requests write: release-branch-rules accepts a
# prep PR only when the release bot opened it.
name: Prepare a release
description: Open the PR that prepares the next rc, GA or patch of a release branch.

inputs:
  kind:
    description: "rc (next candidate), ga (rc.N to .0) or patch (.N to .N+1)"
    required: true
  token:
    description: "Token that pushes the prep branch and opens the PR."
    required: true
  toolchain:
    description: "Rust toolchain for `cargo update -w`. Empty reads rust-toolchain.toml, else stable."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Check the token is set
      shell: bash
      env:
        HAS_TOKEN: ${{ inputs.token != '' }}
      run: |
        set -euo pipefail
        if [ "${HAS_TOKEN}" != "true" ]; then
          echo "::error::token is empty: pass a GitHub App token (see the action's header)"
          exit 1
        fi
    - name: Check the ref is a release branch
      shell: bash
      env:
        REF: ${{ github.ref }}
        KIND: ${{ inputs.kind }}
      run: |
        set -euo pipefail
        case "${REF}" in
          refs/heads/release/*) ;;
          *) echo "::error::run this on a release/<major.minor> branch, not ${REF}"; exit 1 ;;
        esac
        case "${KIND}" in
          rc|ga|patch) ;;
          *) echo "::error::kind must be rc, ga or patch"; exit 1 ;;
        esac
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # A patch's changelog is the commits since the last `v…` tag.
        fetch-depth: 0
        persist-credentials: false
    - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        toolchain: ${{ inputs.toolchain }}
        rustflags: ""
        cache: false
    - name: Check out main beside the release branch (GA)
      if: inputs.kind == 'ga'
      shell: bash
      # fetch-depth 0 fetched every branch, origin/main included.
      run: git worktree add --detach "${RUNNER_TEMP}/main" origin/main
    - name: Bump versions, write the changelog, move RELEASE
      shell: bash
      env:
        KIND: ${{ inputs.kind }}
      run: |
        set -euo pipefail
        args=(--kind "${KIND}" --pr-body "${RUNNER_TEMP}/body.md")
        [ "${KIND}" = "ga" ] && args+=(--main-changelog "${RUNNER_TEMP}/main/CHANGELOG.md")
        python3 "${GITHUB_ACTION_PATH}/../../../scripts/release-branch/prepare-release.py" "${args[@]}"
    - name: Open the PR
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        BASE: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        target=$(cat RELEASE)
        head="release-prep/${BASE#release/}/${target}"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git switch -c "${head}"
        git add -A
        git commit -s -m "chore(release): v${target}"
        # Force and reuse an open PR, so a rerun (after the main-dating step
        # below failed, say) replaces its own earlier branch instead of dying.
        git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${head}"
        if [ -n "$(gh pr list --repo "${REPO}" --base "${BASE}" --head "${head}" --state open --json number --jq '.[].number')" ]; then
          gh pr edit "${head}" --repo "${REPO}" --body-file "${RUNNER_TEMP}/body.md"
        else
          gh pr create --base "${BASE}" --head "${head}" --title "chore(release): v${target}" \
            --body-file "${RUNNER_TEMP}/body.md"
        fi
    - name: Open the PR that dates main's changelog heading (GA)
      if: inputs.kind == 'ga'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        BASE: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        target=$(cat RELEASE)
        cd "${RUNNER_TEMP}/main"
        if git diff --quiet; then
          echo "main's CHANGELOG.md needs no change"
          exit 0
        fi
        name="${BASE#release/}"
        head="release-date/${name}"
        title="chore(release): date ${target} in main's changelog"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git switch -c "${head}"
        git add CHANGELOG.md
        git commit -s -m "${title}"
        # A re-run of the GA prep replaces an earlier, still-open dating PR.
        git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/${head}"
        if [ -n "$(gh pr list --repo "${REPO}" --base main --head "${head}" --state open --json number --jq '.[].number')" ]; then
          gh pr edit "${head}" --repo "${REPO}" --title "${title}"
        else
          gh pr create --repo "${REPO}" --base main --head "${head}" --title "${title}" --body \
            "Gives \`## ${target}\` on main the date the GA prep gave it on \`${BASE}\`, so both branches carry the same heading. Merge it once the \`v${target}\` prep PR is merged and the tag exists."
        fi
