# Build-free guards for a release-branch repository: toolchain pins agree,
# versions are lockstep, CHANGELOG.md and RELEASE are consistent, and a PR
# never moves RELEASE backwards. Run it on every PR and push in the workflow
# whose green run gates a cut. Python 3.11+ on the runner.
name: Release guards
description: Check the invariants the release-branch tooling relies on.

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # The PR's base commit, for "RELEASE never moves backwards".
        fetch-depth: 0
        persist-credentials: false
    - name: Release guards
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: python3 "${GITHUB_ACTION_PATH}/../../../scripts/release-branch/check-release-guards.py" ${BASE_SHA:+--base-sha "$BASE_SHA"}
