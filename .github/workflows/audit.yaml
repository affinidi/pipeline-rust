on:
  workflow_call:
    inputs:
      auditIgnore:
        required: false
        type: string
        default: ''

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: actions-rust-lang/audit@v1
        name: Audit Rust Dependencies
        with:
          ignore: ${{ inputs.auditIgnore }}

      # actions-rust-lang/audit (see https://github.com/actions-rust-lang/audit) creates one
      # GitHub issue per RustSec finding, titled "<RUSTSEC-id>: <title>" or "Crate <name> <version>".
      # Its issue body is built purely from `cargo audit`'s JSON, which only describes the
      # flagged crate itself -- it has no concept of "who depends on it", so there is no
      # existing input/flag to make it show that. This step re-runs `cargo audit --json`
      # (cargo-audit is already installed on PATH by the composite action above), cross-references
      # each finding against `cargo tree -i <pkg> --depth 1` to see what depends on it one level
      # up, and comments on the matching issue with whether it's a direct dependency of this
      # workspace or a transitive one (and, if transitive, who pulls it in).
      - name: Annotate issues with direct/transitive dependency info
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Hidden marker embedded in every comment we post. We look for it before
          # commenting so this step annotates each issue exactly once, rather than
          # appending a fresh comment on every (daily) scheduled run.
          MARKER="<!-- affinidi-dependency-type-annotation -->"

          cargo audit --json > audit-report.json || true

          if ! jq -e . audit-report.json >/dev/null 2>&1; then
            echo "No valid cargo-audit JSON report produced, skipping annotation."
            exit 0
          fi

          MEMBERS=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[].name' | sort -u)

          jq -c '
            (.vulnerabilities.list // [])
            + (.warnings.unmaintained // [])
            + (.warnings.unsound // [])
            + (.warnings.yanked // [])
          ' audit-report.json | jq -c '.[]?' | while read -r entry; do
            ADVISORY_ID=$(echo "$entry" | jq -r '.advisory.id // empty')
            PKG_NAME=$(echo "$entry" | jq -r '.package.name')
            PKG_VER=$(echo "$entry" | jq -r '.package.version')
            TITLE_PREFIX="${ADVISORY_ID:-Crate $PKG_NAME $PKG_VER}"

            PARENTS=$(cargo tree -i "${PKG_NAME}@${PKG_VER}" --depth 1 -e normal,build,dev --prefix none 2>/dev/null \
              | tail -n +2 | awk '{print $1}' | sort -u)

            DIRECT="no"
            for p in $PARENTS; do
              if echo "$MEMBERS" | grep -qx "$p"; then
                DIRECT="yes"
              fi
            done

            PARENTS_LIST=$(echo "$PARENTS" | paste -sd ',' - | sed 's/,/, /g')

            if [ "$DIRECT" = "yes" ]; then
              NOTE="**Dependency type:** Direct dependency — declared in this workspace's own \`Cargo.toml\`."
            else
              NOTE="**Dependency type:** Transitive dependency — pulled in via: \`${PARENTS_LIST:-unknown}\`. Not declared directly in this workspace's \`Cargo.toml\`."
            fi

            echo "::group::${TITLE_PREFIX}"
            echo "$NOTE"
            echo "::endgroup::"

            ISSUE_NUM=$(gh issue list --search "\"${TITLE_PREFIX}\" in:title" --state open --json number,title \
              --jq "[.[] | select(.title | startswith(\"${TITLE_PREFIX}\"))][0].number // empty")

            if [ -n "$ISSUE_NUM" ]; then
              ALREADY=$(gh issue view "$ISSUE_NUM" --json comments \
                --jq "[.comments[].body | select(contains(\"$MARKER\"))] | length")
              if [ "$ALREADY" -gt 0 ]; then
                echo "Issue #${ISSUE_NUM} already annotated, skipping comment."
              else
                gh issue comment "$ISSUE_NUM" --body "${NOTE}"$'\n\n'"${MARKER}"
              fi
            else
              echo "No matching open issue found for ${TITLE_PREFIX}, skipping comment."
            fi
          done
