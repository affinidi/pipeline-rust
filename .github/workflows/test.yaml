on:
  workflow_call:
    inputs:
      toolchain:
        required: false
        type: string
        default: stable
      rustflags:
        required: false
        type: string
        default: ""
      ubuntu-rust-deps:
        required: false
        type: string
        default: libdbus-1-dev libssl-dev
      useRedis:
        required: false
        type: boolean
        default: true
      # The three below are opt-in and default to the old behaviour. A large
      # workspace's `cargo test` can exhaust a standard runner's disk or memory,
      # and the runner is then killed — the job ends "The runner has received a
      # shutdown signal" (exit 143) mid-compile, with no test having run and no
      # clue which resource ran out. affinidi-tdk-rs hit this on several PRs on
      # 2026-10-11.
      free-disk-space:
        description: >-
          Remove preinstalled toolchains a Rust build never uses (.NET, Android,
          GHC, CodeQL) before building. Typically frees 20-30 GB.
        required: false
        type: boolean
        default: false
      lean-debuginfo:
        description: >-
          Build tests with line-tables-only debug info and no incremental
          compilation. Shrinks target/ and lowers linker memory; backtraces keep
          file and line. Does not change what is tested.
        required: false
        type: boolean
        default: false
      build-jobs:
        description: >-
          Cap parallel compile jobs (CARGO_BUILD_JOBS), to trade wall-clock time
          for peak memory. Empty leaves cargo's default (one per CPU).
        required: false
        type: string
        default: ""
      runs-on:
        required: false
        type: string
        default: ubuntu-24.04

jobs:
  test:
    name: Test Suite
    runs-on: ${{ inputs.runs-on }}
    services:
      redis:
        image: ${{ inputs.useRedis && 'redis' || ''}}
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ inputs.toolchain }}
          rustflags: ${{ inputs.rustflags }}
          override: true
      - uses: affinidi/pipeline-rust/.github/actions/rust-dependencies@main
        with:
          ubuntu-rust-deps: ${{ inputs.ubuntu-rust-deps }}
      - name: Free disk space
        if: ${{ inputs.free-disk-space }}
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null || true
          df -h /
      - name: Lean debug info
        if: ${{ inputs.lean-debuginfo }}
        run: |
          echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_TEST_DEBUG=line-tables-only" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
      - name: Cap compile jobs
        if: ${{ inputs.build-jobs != '' }}
        run: echo "CARGO_BUILD_JOBS=${{ inputs.build-jobs }}" >> "$GITHUB_ENV"
      - name: cargo test
        run: |
          # Memory and disk every 30 s, into this step's own log. A runner killed
          # for running out of either runs no later step, so an `if: always()`
          # report would never print; this one has already printed by then.
          (
            while true; do
              echo "::group::resources $(date -u +%H:%M:%S)"
              free -m | sed -n '1,2p'
              df -h / | tail -1
              du -sh target 2>/dev/null || true
              echo "::endgroup::"
              sleep 30
            done
          ) &
          sampler=$!
          trap 'kill $sampler 2>/dev/null || true' EXIT
          cargo test
