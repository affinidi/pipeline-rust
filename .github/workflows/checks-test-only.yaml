on:
  workflow_call:
    inputs:
      toolchain:
        required: false
        type: string
        default: stable
      rustflags:
        required: false
        type: string
        default: ""
      ubuntu-rust-deps:
        required: false
        type: string
        default: libdbus-1-dev libssl-dev
      coverage:
        required: false
        type: number
        default: 80
      useRedis:
        required: false
        type: boolean
        default: true
      # Passed to test.yaml; see the descriptions there.
      free-disk-space:
        required: false
        type: boolean
        default: false
      lean-debuginfo:
        required: false
        type: boolean
        default: false
      build-jobs:
        required: false
        type: string
        default: ""
      runs-on:
        required: false
        type: string
        default: ubuntu-24.04

jobs:
  test:
    uses: affinidi/pipeline-rust/.github/workflows/test.yaml@main
    with:
      toolchain: ${{ inputs.toolchain }}
      rustflags: ${{ inputs.rustflags }}
      ubuntu-rust-deps: ${{ inputs.ubuntu-rust-deps }}
      useRedis: ${{ inputs.useRedis }}
      free-disk-space: ${{ inputs.free-disk-space }}
      lean-debuginfo: ${{ inputs.lean-debuginfo }}
      build-jobs: ${{ inputs.build-jobs }}
      runs-on: ${{ inputs.runs-on }}

  coverage:
    uses: affinidi/pipeline-rust/.github/workflows/coverage.yaml@main
    with:
      toolchain: ${{ inputs.toolchain }}
      rustflags: ${{ inputs.rustflags }}
      ubuntu-rust-deps: ${{ inputs.ubuntu-rust-deps }}
      coverage: ${{ inputs.coverage }}
      useRedis: ${{ inputs.useRedis }}
      runs-on: ${{ inputs.runs-on }}
