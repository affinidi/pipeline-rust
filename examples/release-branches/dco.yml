name: DCO

on:
  pull_request:
    branches: [main, "release/**"]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    # The job name is the required status check.
    name: DCO sign-off
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: affinidi/pipeline-rust/.github/actions/release-dco@<commit>
